        selected: false
        code_language: python3
        code: "import json\nimport re\n\nMAX_QUERY_LENGTH = 160\n\ndef _clean(value, limit=None):\n    if not isinstance(value,\
          \ str):\n        return ''\n    text = ' '.join(value.split()).strip()\n    return text[:limit] if limit\
          \ is not None else text\n\ndef _explicit_original(value):\n    text = _clean(value)\n    vague = ('这个',\
          \ '这个怎么办', '怎么回事', '帮我看看', '处理一下', '怎么办')\n    # A named object plus a question/action is explicit enough\
          \ to safely search.\n    return 5 <= len(text) <= MAX_QUERY_LENGTH and not any(x == text or text.startswith(x)\
          \ for x in vague)\n\ndef _safe_query(value):\n    text = _clean(value)\n    if not text or len(text) >\
          \ MAX_QUERY_LENGTH:\n        return ''\n    # A retrieval query is a noun phrase/question, never a multi-step\
          \ answer.\n    if '\\n' in text or re.search(r'(^|[，。；])\\s*(首先|其次|然后|第一步|第二步|建议你|可以先|具体做法|总结如下)', text):\n\
          \        return ''\n    if len(re.findall(r'[。；]', text)) > 0 or len(text.split('，')) > 2:\n        return\
          \ ''\n    return text\n\ndef main(plan_text: str, original_query: str) -> dict:\n    original = _clean(original_query)\n\
          \    plan = None\n    try:\n        decoded = json.loads(plan_text)\n        if isinstance(decoded, dict):\n\
          \            plan = decoded\n    except (TypeError, json.JSONDecodeError):\n        pass\n\n    query\
          \ = _safe_query(plan.get('question')) if plan else ''\n    facts = plan.get('confirmed_facts', []) if\
          \ plan else []\n    if not isinstance(facts, list):\n        facts = []\n    facts = [_clean(item, 240)\
          \ for item in facts if isinstance(item, str) and _clean(item, 240)][:8]\n    needs = bool(plan.get('needs_clarification'))\
          \ if plan else False\n    clarify = _clean(plan.get('clarification_question'), 240) if plan else ''\n\n\
          \    if not query and len(original_query or '') > MAX_QUERY_LENGTH:\n        heading = re.search(r'^\\\
          s{0,3}#{1,6}\\s+(.{2,120})$', original_query, re.MULTILINE)\n        if heading:\n            query =\
          \ _safe_query(_clean(heading.group(1), 120) + ' 相关论述')\n            if query:\n                needs =\
          \ False\n    if query:\n        needs = False\n    if plan and needs:\n        if not clarify:\n     \
          \       clarify = '我还不能从当前文字和附件确定要检索的对象或问题。请补充对象名称、想解决的具体情况，或上传更清晰的截图。'\n        return {'query': '',\
          \ 'confirmed_facts_json': json.dumps(facts, ensure_ascii=False),\n                'needs_clarification':\
          \ True, 'clarification_question': clarify}\n    if query and not needs:\n        return {'query': query,\
          \ 'confirmed_facts_json': json.dumps(facts, ensure_ascii=False),\n                'needs_clarification':\
          \ False, 'clarification_question': ''}\n    if _explicit_original(original):\n        # A malformed model\
          \ response may only fall back to a clear user query.\n        return {'query': original, 'confirmed_facts_json':\
          \ json.dumps(facts, ensure_ascii=False),\n                'needs_clarification': False, 'clarification_question':\
          \ ''}\n    if not clarify:\n        clarify = '我还不能从当前文字和附件确定要检索的对象或问题。请补充对象名称、想解决的具体情况，或上传更清晰的截图。'\n\
          \    return {'query': '', 'confirmed_facts_json': json.dumps(facts, ensure_ascii=False),\n           \
          \ 'needs_clarification': True, 'clarification_question': clarify}\n"
        variables:
