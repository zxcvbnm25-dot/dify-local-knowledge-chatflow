        desc: 只允许 bridge 签发的 /images/{collection}/{id} 签名链接，Docker 使用 host.docker.internal 读取原图。
        selected: false
        code_language: python3
        code: "import re\nfrom urllib.parse import parse_qs, urlsplit, urlunsplit\n\nIMAGE_PATH = re.compile(r\"\
          ^/images/[A-Za-z0-9_-]{1,128}/[A-Za-z0-9_-]{1,128}$\")\nALLOWED_HOSTS = {\"localhost\", \"127.0.0.1\"\
          , \"host.docker.internal\"}\n\ndef _docker_download_url(value: str) -> str | None:\n    try:\n       \
          \ parsed = urlsplit(value)\n        query = parse_qs(parsed.query, keep_blank_values=True)\n        port\
          \ = parsed.port\n    except (TypeError, ValueError):\n        return None\n    if parsed.scheme != \"\
          http\" or parsed.hostname not in ALLOWED_HOSTS:\n        return None\n    if parsed.username is not None\
          \ or parsed.password is not None or parsed.fragment:\n        return None\n    if port != 8004 or not\
          \ IMAGE_PATH.fullmatch(parsed.path):\n        return None\n    if set(query) != {\"expires\", \"signature\"\
          }:\n        return None\n    if len(query[\"expires\"]) != 1 or len(query[\"signature\"]) != 1:\n    \
          \    return None\n    if not query[\"expires\"][0].isdigit() or not re.fullmatch(r\"[0-9a-fA-F]{64}\"\
          , query[\"signature\"][0]):\n        return None\n    return urlunsplit((\"http\", \"host.docker.internal:8004\"\
          , parsed.path, parsed.query, \"\"))\n\ndef main(images: list, prior_notice: str) -> dict:\n    prepared\
          \ = []\n    for image in (images or [])[:4]:\n        if not isinstance(image, dict):\n            continue\n\
          \        download_url = _docker_download_url(image.get(\"url\", \"\"))\n        point_id = urlsplit(image.get(\"\
          url\", \"\")).path.rsplit(\"/\", 1)[-1]\n        if not download_url or image.get(\"id\") != point_id:\n\
          \            continue\n        prepared.append({\n            \"id\": image[\"id\"],\n            \"display_url\"\
          : image[\"url\"],\n            \"download_url\": download_url,\n            \"caption\": image.get(\"\
          caption\", \"\"),\n            \"source\": image.get(\"source\", \"\"),\n            \"context_before\"\
          : image.get(\"context_before\", \"\"),\n            \"context_after\": image.get(\"context_after\", \"\
          \"),\n        })\n    notice = prior_notice if isinstance(prior_notice, str) else \"\"\n    if images\
          \ and not prepared and not notice:\n        notice = \"找到关联图片，但没有获得可供 Docker 下载的可信签名地址。\"\n    return\
          \ {\"images\": prepared, \"image_count\": len(prepared), \"notice\": notice}"
