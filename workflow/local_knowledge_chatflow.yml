    - id: validate_evidence_filter
      type: custom
      position:
        x: 5394
        y: 646.8166666666667
      positionAbsolute:
        x: 5394
        y: 646.8166666666667
      width: 242
      height: 95
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 验证证据筛选结果
        desc: 验证逐字证据，并按候选 ID 附加同轮可信来源映射。
        selected: false
        code_language: python3
        code: "import json\n\ndef _clean(value, limit):\n    return value.strip()[:limit] if isinstance(value, str)\
          \ else ''\n\ndef _markdown(value):\n    return _clean(value, 1200).replace('\\\\', '\\\\\\\\').replace('[',\
          \ '\\\\[').replace(']', '\\\\]').replace('`', '\\\\`')\n\ndef _source_links(raw):\n    try:\n        values\
          \ = json.loads(raw)\n    except (TypeError, json.JSONDecodeError):\n        values = {}\n    return values\
          \ if isinstance(values, dict) else {}\n\ndef _trusted_link(links, identity):\n    value = links.get(identity)\n\
          \    if not isinstance(value, dict):\n        return {'source_url': '', 'source_key': '', 'section': ''}\n\
          \    return {'source_url': _clean(value.get('source_url'), 2400),\n            'source_key': _clean(value.get('source_key'),\
          \ 800),\n            'section': _clean(value.get('section'), 500)}\n\ndef main(candidates_json: str, filter_json:\
          \ str, source_links_json: str) -> dict:\n    try:\n        candidates = json.loads(candidates_json)\n\
          \    except (TypeError, json.JSONDecodeError):\n        candidates = []\n    table = {item.get('id'):\
          \ item for item in candidates if isinstance(item, dict) and isinstance(item.get('id'), str)}\n    links\
          \ = _source_links(source_links_json)\n    try:\n        decision = json.loads(filter_json)\n        selected\
          \ = decision.get('selected', []) if isinstance(decision, dict) else []\n    except (TypeError, json.JSONDecodeError):\n\
          \        selected = []\n    verified, seen = [], set()\n    for item in selected if isinstance(selected,\
          \ list) else []:\n        if not isinstance(item, dict):\n            continue\n        identity = item.get('id')\n\
          \        quote = _clean(item.get('quote'), 1200)\n        supports = _clean(item.get('supports'), 360)\n\
          \        conditions = _clean(item.get('conditions'), 360)\n        candidate = table.get(identity)\n \
          \       if identity in seen or not candidate or not quote or not supports:\n            continue\n   \
          \     # The quote must literally exist in this exact candidate. A model cannot forge it.\n        if quote\
          \ not in candidate.get('text', ''):\n            continue\n        if len(quote) < min(8, len(candidate.get('text',\
          \ ''))):\n            continue\n        seen.add(identity)\n        verified_item = {'id': identity, 'source':\
          \ _clean(candidate.get('source'), 500),\n                         'quote': quote, 'supports': supports,\n\
          \                         'conditions': conditions or '原文未说明'}\n        # This mapping comes from the\
          \ retrieval record, never the LLM decision.\n        verified_item.update(_trusted_link(links, identity))\n\
          \        verified.append(verified_item)\n        if len(verified) >= 6:\n            break\n    context\
          \ = []\n    citations = []\n    for item in verified:\n        # Keep signed links out of both answer\
          \ and evidence-filter LLM contexts.\n        context.append('证据 ID：{id}\\n来源：{source}\\n逐字摘录：{quote}\\\
          n支持的问题点：{supports}\\n适用条件：{conditions}'.format(**item))\n        citations.append('- `{id}`｜{source}\\\
          n  摘录：“{quote}”'.format(\n            id=item['id'], source=_markdown(item['source']), quote=_markdown(item['quote'])))\n\
          \    return {'verified_evidence_json': json.dumps(verified, ensure_ascii=False),\n            'verified_context':\
          \ '\\n\\n===== 已验证证据 =====\\n\\n'.join(context) or '没有通过验证的文字证据。',\n            'citation_candidates_markdown':\
          \ '\\n'.join(citations),\n            'evidence_count': len(verified)}\n"
        variables:
        - variable: candidates_json
          value_selector:
          - pack_candidates
          - candidates_json
        - variable: filter_json
          value_selector:
          - evidence_filter_llm
          - text
        - variable: source_links_json
          value_selector:
          - pack_candidates
          - source_links_json
        outputs:
          verified_evidence_json:
            type: string
            children: null
          verified_context:
            type: string
            children: null
          citation_candidates_markdown:
            type: string
            children: null
          evidence_count:
            type: number
            children: null
      zIndex: 0
      selected: false
    - id: format_grounded_answer
      type: custom
      position:
        x: 9360
        y: 847.4833333333333
      positionAbsolute:
        x: 9360
        y: 847.4833333333333
      width: 242
      height: 95
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 校验答案引用并格式化
        desc: 校验已验证证据引用；兼容带可核验引用的 Markdown，并区分无证据与格式异常。
        selected: false
        code_language: python3
        code: "import json\nimport re\nfrom urllib.parse import parse_qsl, quote, urlsplit\n\nSAFE_NO_EVIDENCE =\
          \ '本轮检索没有找到足够的已验证文字证据，暂时无法根据知识库可靠回答这个问题。请补充相关资料或换一种更具体的问法。'\nFORMAT_ERROR = '已找到已验证证据，但回答格式或引用校验失败；为避免把生成错误说成“没有资料”，请重试本轮回答。'\n\
          \nSOURCE_WIDE_ABSENCE = re.compile(\n    r'(?:原文|原资料|原文件|整个知识库|当前知识库)(?:中)?'\n    r'(?:未说明|没有说明|未提供|没有提供|只提供|仅提供|没有其他|不包含)'\n\
          )\nFENCED_JSON = re.compile(r'^\\s*```(?:json)?\\s*\\n?(.*?)\\n?```\\s*$', re.IGNORECASE | re.DOTALL)\n\
          EVIDENCE_LABEL = re.compile(\n    r'(?:证据|引用|依据)\\s*(?:ID)?\\s*[:：#]?\\s*'\n    r'((?:c[A-Za-z0-9_-]+\\\
          s*(?:(?:[,，、/／和及]|\\s+)\\s*c[A-Za-z0-9_-]+\\s*)*))',\n    re.IGNORECASE,\n)\nPAREN_REF = re.compile(r'[（(]\\\
          s*((?:c[A-Za-z0-9_-]+\\s*(?:(?:[,，、/／和及]|\\s+)\\s*c[A-Za-z0-9_-]+\\s*)*))\\s*[）)]', re.IGNORECASE)\nBRACKET_REF\
          \ = re.compile(r'\\[\\s*((?:c[A-Za-z0-9_-]+\\s*(?:(?:[,，、/／和及]|\\s+)\\s*c[A-Za-z0-9_-]+\\s*)*))\\s*\\\
          ]', re.IGNORECASE)\nID_RE = re.compile(r'c[A-Za-z0-9_-]+', re.IGNORECASE)\nVISIBLE_REFERENCE_MARKER =\
          \ re.compile(\n    r'(?:[（(]\\s*(?:(?:证据|引用|依据)\\s*(?:ID)?\\s*[:：#]?\\s*)?'\n    r'(?:c[A-Za-z0-9_-]+\\\
          s*(?:(?:[,，、/／和及]|\\s+)\\s*c[A-Za-z0-9_-]+\\s*)*)\\s*[）)]'\n    r'|\\[\\s*(?:(?:证据|引用|依据)\\s*(?:ID)?\\\
          s*[:：#]?\\s*)?'\n    r'(?:c[A-Za-z0-9_-]+\\s*(?:(?:[,，、/／和及]|\\s+)\\s*c[A-Za-z0-9_-]+\\s*)*)\\s*\\])',\n\
          \    re.IGNORECASE,\n)\n\n\ndef _clean(value, limit):\n    return value.strip()[:limit] if isinstance(value,\
          \ str) else ''\n\n\ndef _escape(value):\n    return (_clean(value, 1200).replace('\\r', ' ').replace('\\\
          n', ' ')\n            .replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')\n            .replace('\\\
          \\', '\\\\\\\\').replace('[', '\\\\[').replace(']', '\\\\]').replace('`', '\\\\`'))\n\n\ndef _result(text,\
          \ used, status, reason, answer_text=None, sources_markdown=''):\n    return {\n        'text': text,\n\
          \        'used_ids_json': json.dumps(used, ensure_ascii=False),\n        'status': status,\n        'reason':\
          \ reason,\n        'answer_text': answer_text if isinstance(answer_text, str) else text,\n        'sources_markdown':\
          \ sources_markdown if isinstance(sources_markdown, str) else '',\n    }\n\n\ndef _verified_table(raw):\n\
          \    try:\n        values = json.loads(raw)\n    except (TypeError, json.JSONDecodeError):\n        values\
          \ = []\n    if not isinstance(values, list):\n        return {}\n    table = {}\n    for item in values:\n\
          \        if not isinstance(item, dict):\n            continue\n        identity = item.get('id')\n   \
          \     if isinstance(identity, str) and identity.strip():\n            table[identity.strip()] = item\n\
          \    return table\n\n\ndef _remove_source_wide_absence(answer):\n    # A retrieved excerpt cannot establish\
          \ what the entire source omits.\n    return ''.join(\n        sentence for sentence in re.split(r'(?<=[。！？!?])',\
          \ answer)\n        if '没有足够依据' in sentence or not SOURCE_WIDE_ABSENCE.search(sentence)\n    ).strip()\n\
          \n\ndef _dedupe(values):\n    seen = set()\n    result = []\n    for value in values:\n        if value\
          \ not in seen:\n            seen.add(value)\n            result.append(value)\n    return result\n\n\n\
          def _safe_source_url(value):\n    raw = _clean(value, 2400)\n    if not raw or '\\\\' in raw:\n      \
          \  return ''\n    try:\n        parsed = urlsplit(raw)\n        port = parsed.port\n        query = parse_qsl(parsed.query,\
          \ keep_blank_values=True, strict_parsing=True)\n    except (TypeError, ValueError):\n        return ''\n\
          \    if parsed.scheme != 'http' or parsed.hostname not in {'localhost', '127.0.0.1'} or port != 8004:\n\
          \        return ''\n    if parsed.username is not None or parsed.password is not None or parsed.fragment:\n\
          \        return ''\n    if not re.fullmatch(r'/sources/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+', parsed.path):\n\
          \        return ''\n    if len(query) != 2 or {key for key, _ in query} != {'expires', 'signature'}:\n\
          \        return ''\n    fields = dict(query)\n    if not fields['expires'].isdigit() or not re.fullmatch(r'[A-Fa-f0-9]{64}',\
          \ fields['signature']):\n        return ''\n    # Keep normal percent escapes intact instead of double-encoding\
          \ a signed URL.\n    return quote(raw, safe=':/?&=#%')\n\n\ndef _source_label(value):\n    source = _clean(value,\
          \ 500).replace('\\\\', '/')\n    label = source.rstrip('/').rsplit('/', 1)[-1] if source else ''\n   \
          \ return _escape(label or '未提供来源标题')\n\n\ndef _citation_text(table, used):\n    groups = {}\n    order\
          \ = []\n    for identity in used:\n        item = table[identity]\n        source = _clean(item.get('source'),\
          \ 500) or '未提供来源标题'\n        source_key = _clean(item.get('source_key'), 800)\n        group_key = ('key:'\
          \ + source_key) if source_key else ('source:' + source)\n        if group_key not in groups:\n       \
          \     groups[group_key] = {'source': source, 'url': ''}\n            order.append(group_key)\n       \
          \ if not groups[group_key]['url']:\n            groups[group_key]['url'] = _safe_source_url(item.get('source_url'))\n\
          \    lines = []\n    for group_key in order:\n        group = groups[group_key]\n        if group['url']:\n\
          \            lines.append('- [{}]({})'.format(_source_label(group['source']), group['url']))\n       \
          \ else:\n            lines.append('- {}（原文链接暂不可用）'.format(_source_label(group['source'])))\n    return\
          \ '\\n\\n### 本次使用的资料\\n\\n' + '\\n'.join(lines) if lines else ''\n\n\ndef _with_citations(answer, table,\
          \ used, status, reason):\n    sources = _citation_text(table, used)\n    return _result(answer + sources,\
          \ used, status, reason, answer, sources)\n\n\ndef _json_payload(raw):\n    if not isinstance(raw, str):\n\
          \        return None, 'answer_not_string'\n    candidate = raw.strip()\n    fenced = FENCED_JSON.match(candidate)\n\
          \    source = 'fenced_json' if fenced else 'json'\n    if fenced:\n        candidate = fenced.group(1).strip()\n\
          \    try:\n        payload = json.loads(candidate)\n    except json.JSONDecodeError:\n        return None,\
          \ 'not_json'\n    return (payload, source) if isinstance(payload, dict) else (None, 'json_not_object')\n\
          \n\ndef _markdown_ids(answer):\n    groups = []\n    for pattern in (EVIDENCE_LABEL, PAREN_REF, BRACKET_REF):\n\
          \        groups.extend(match.group(1) for match in pattern.finditer(answer))\n    return _dedupe(identity.lower()\
          \ for group in groups for identity in ID_RE.findall(group))\n\n\ndef _strip_visible_reference_markers(answer):\n\
          \    # Validate every marker first; this only removes the compact display notation.\n    return re.sub(r'[\
          \ \\t]{2,}', ' ', VISIBLE_REFERENCE_MARKER.sub('', answer)).strip()\n\n\ndef main(answer_json: str, verified_evidence_json:\
          \ str) -> dict:\n    table = _verified_table(verified_evidence_json)\n    if not table:\n        return\
          \ _result(SAFE_NO_EVIDENCE, [], 'no_evidence', 'verified_evidence_empty')\n\n    payload, payload_reason\
          \ = _json_payload(answer_json)\n    if payload is not None:\n        answer = _remove_source_wide_absence(_clean(payload.get('answer'),\
          \ 12000))\n        used = payload.get('used_evidence_ids', [])\n        if not isinstance(used, list)\
          \ or any(not isinstance(item, str) for item in used):\n            return _result(FORMAT_ERROR, [], 'format_error',\
          \ 'json_used_ids_invalid')\n        used = _dedupe(item.strip() for item in used)\n        if any(not\
          \ item or item not in table for item in used):\n            return _result(FORMAT_ERROR, [], 'format_error',\
          \ 'json_unverified_reference')\n        if not answer:\n            return _result(FORMAT_ERROR, [], 'format_error',\
          \ 'json_answer_empty')\n        if not used:\n            if '没有足够依据' in answer or '没有足够的依据' in answer:\n\
          \                return _result(answer, [], 'insufficient_evidence', 'json_declared_insufficient_evidence')\n\
          \            return _result(FORMAT_ERROR, [], 'format_error', 'json_reference_missing')\n        explicit_ids\
          \ = _markdown_ids(answer)\n        if any(identity not in table for identity in explicit_ids):\n     \
          \       return _result(FORMAT_ERROR, [], 'format_error', 'json_answer_unverified_reference')\n       \
          \ if any(identity not in used for identity in explicit_ids):\n            return _result(FORMAT_ERROR,\
          \ [], 'format_error', 'json_answer_reference_not_declared')\n        return _with_citations(_strip_visible_reference_markers(answer),\
          \ table, used, 'ok', payload_reason)\n\n    answer = _remove_source_wide_absence(_clean(answer_json, 12000))\n\
          \    used = _markdown_ids(answer)\n    if not answer:\n        return _result(FORMAT_ERROR, [], 'format_error',\
          \ payload_reason)\n    if not used:\n        return _result(FORMAT_ERROR, [], 'format_error', 'markdown_reference_missing')\n\
          \    if any(identity not in table for identity in used):\n        return _result(FORMAT_ERROR, [], 'format_error',\
          \ 'markdown_unverified_reference')\n    return _with_citations(_strip_visible_reference_markers(answer),\
          \ table, used, 'ok', 'markdown_citations')\n"
        variables:
