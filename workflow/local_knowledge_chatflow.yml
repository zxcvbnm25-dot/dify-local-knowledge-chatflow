        desc: 按图片 ID 汇总。下载或视觉调用失败时仍返回原图，并明确标识未能读取。
        selected: false
        code_language: python3
        code: "import json\n\ndef _text(value: object, limit: int = 2400) -> str:\n    return value.strip()[:limit]\
          \ if isinstance(value, str) else \"\"\n\ndef _markdown_label(value: object, limit: int) -> str:\n    text\
          \ = \" \".join(_text(value, limit).split())\n    return (text.replace(\"\\\\\", \"\\\\\\\\\")\n      \
          \          .replace(\"[\", \"\\\\[\")\n                .replace(\"]\", \"\\\\]\")\n                .replace(\"\
          (\", \"\\\\(\")\n                .replace(\")\", \"\\\\)\"))\n\ndef main(images: list, results: list,\
          \ notice: str) -> dict:\n    analyses = {}\n    for value in results or []:\n        if not isinstance(value,\
          \ str):\n            continue\n        try:\n            item = json.loads(value)\n        except (TypeError,\
          \ json.JSONDecodeError):\n            continue\n        if isinstance(item, dict) and isinstance(item.get(\"\
          id\"), str):\n            analysis = _text(item.get(\"analysis\"))\n            if analysis:\n       \
          \         analyses[item[\"id\"]] = analysis\n\n    markdown_parts = []\n    evidence_parts = []\n    displayable_count\
          \ = 0\n    for index, image in enumerate(images or [], start=1):\n        if not isinstance(image, dict):\n\
          \            continue\n        image_id = image.get(\"id\", \"\")\n        url = image.get(\"url\", \"\
          \")\n        if not isinstance(image_id, str) or not isinstance(url, str):\n            continue\n   \
          \     analysis = analyses.get(image_id)\n        if not analysis:\n            analysis = \"本次未能读取该原图，因此不能根据图片内容判断；下方仍保留原图供查看。\"\
          \n        title = f\"关联图片 {index}\"\n        source = _markdown_label(image.get(\"source\"), 500)\n  \
          \      context_before = _markdown_label(image.get(\"context_before\"), 900)\n        context_after = _markdown_label(image.get(\"\
          context_after\"), 900)\n        context = \"\\n\\n\".join(part for part in (context_before, context_after)\
          \ if part)\n        markdown_parts.append(\n            f\"### {title}\\n\\n\"\n            f\"图片 ID：`{image_id}`\\\
          n\\n\"\n            f\"图片解读：{analysis}\\n\\n\"\n            f\"![{title}]({url})\"\n            + (f\"\
          \\n\\n来源：{source}\" if source else \"\")\n            + (f\"\\n\\n图片相邻正文：{context}\" if context else \"\
          \")\n        )\n        displayable_count += 1\n        evidence_parts.append(\n            f\"图片 {index}（稳定\
          \ ID：{image_id}；来源：{source or '未提供'}；可展示原图：是）的视觉解读：\\n{analysis}\"\n        )\n    if notice:\n      \
          \  markdown_parts.insert(0, f\"> {notice}\")\n    markdown = \"\\n\\n## 关联图片解读\\n\\n\" + \"\\n\\n---\\\
          n\\n\".join(markdown_parts) if markdown_parts else (f\"\\n\\n> {notice}\" if notice else \"\")\n    evidence_header\
          \ = (\n        f\"系统会在最终回答正文之后自动附加以下 {displayable_count} 张可展示原图及其来源。\"\n        \"不要声称无法返回原图，也不要把本轮检索片段不足解释为某个文件不存在。\"\
          \n    )\n    return {\n        \"markdown\": markdown,\n        \"vision_context\": evidence_header +\
          \ \"\\n\\n\" + (\"\\n\\n\".join(evidence_parts) or \"没有可用的图片视觉解读。\"),\n        \"image_count\": displayable_count,\n\
          \    }"
