        title: 编号检索候选
        desc: 编号检索候选，并将可信来源链接映射与候选正文隔离。
        selected: false
        code_language: python3
        code: "import json\n\ndef _text(value, limit):\n    return value.strip()[:limit] if isinstance(value, str)\
          \ else ''\n\ndef _metadata(record):\n    metadata = record.get('metadata') if isinstance(record.get('metadata'),\
          \ dict) else {}\n    doc_metadata = metadata.get('doc_metadata') if isinstance(metadata.get('doc_metadata'),\
          \ dict) else {}\n    return metadata, doc_metadata\n\ndef _source(record):\n    metadata, doc_metadata\
          \ = _metadata(record)\n    # Dify bridge results put the stable vault path under metadata.doc_metadata.\n\
          \    for mapping in (doc_metadata, metadata, record):\n        for key in ('relative_path', 'path', 'document_name',\
          \ 'doc_name', 'source', 'title', 'name'):\n            value = mapping.get(key)\n            if isinstance(value,\
          \ str) and value.strip():\n                return _text(value, 500)\n    return '未提供来源标题'\n\ndef _trusted_link(record):\n\
          \    metadata, doc_metadata = _metadata(record)\n    for mapping in (doc_metadata, metadata, record):\n\
          \        if not isinstance(mapping, dict):\n            continue\n        source_url = _text(mapping.get('source_url'),\
          \ 2400)\n        source_key = _text(mapping.get('source_key'), 800)\n        section = _text(mapping.get('section')\
          \ or mapping.get('heading'), 500)\n        if source_url or source_key or section:\n            return\
          \ {'source_url': source_url, 'source_key': source_key, 'section': section}\n    return {'source_url':\
          \ '', 'source_key': '', 'section': ''}\n\ndef main(result: list) -> dict:\n    candidates = []\n    source_links\
          \ = {}\n    for record in result or []:\n        if not isinstance(record, dict):\n            continue\n\
          \        # Dify string outputs cap at 80k. Ten 5k snippets leave room for JSON metadata.\n        text\
          \ = _text(record.get('content') or record.get('text') or record.get('segment'), 5000)\n        if not\
          \ text:\n            continue\n        identity = f'c{len(candidates)+1}'\n        # Candidate JSON goes\
          \ to an LLM. Never put signed URLs or source keys in it.\n        candidates.append({'id': identity, 'source':\
          \ _source(record), 'text': text})\n        source_links[identity] = _trusted_link(record)\n        if\
          \ len(candidates) >= 10:\n            break\n    return {'candidates_json': json.dumps(candidates, ensure_ascii=False),\n\
          \            'source_links_json': json.dumps(source_links, ensure_ascii=False),\n            'candidate_count':\
          \ len(candidates)}\n"
        variables:
        - variable: result
          value_selector:
          - knowledge_retrieval
          - result
        outputs:
          candidates_json:
            type: string
            children: null
          candidate_count:
            type: number
            children: null
          source_links_json:
            type: string
            children: null
      zIndex: 0
      selected: false
